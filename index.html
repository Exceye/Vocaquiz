<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Teka Teki Vocabulary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .card-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center border-t-4 border-blue-500 card-enter">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Tebak Kosa Kata 🧠</h1>
        <p class="text-gray-500 mb-6 text-sm">Ketik terjemahan dari kata di bawah ini (Inggris ➔ Indonesia).</p>

        <div class="flex justify-between items-center mb-6 bg-blue-50 p-3 rounded-lg">
            <span class="font-semibold text-blue-800">Skor: <span id="score" class="text-xl">0</span></span>
            <button onclick="resetGame()" class="text-sm text-red-500 hover:text-red-700 font-semibold transition-colors">Reset Game</button>
        </div>

        <div class="mb-8">
            <h2 class="text-sm text-gray-400 font-semibold uppercase tracking-wider mb-2" id="question-label">Terjemahkan ke <span id="target-lang">Bahasa Indonesia</span></h2>
            <div id="question-word" class="text-3xl font-bold text-gray-800 break-words min-h-[40px]">
                Loading...
            </div>
        </div>

        <div class="w-full">
            <input type="text" id="answer-input" 
                class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 text-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all text-center"
                placeholder="Ketik jawabanmu di sini..." autocomplete="off" autofocus>
            
            <!-- Tempat feedback sekarang di dalam kotak, tidak akan terpotong layar -->
            <div class="min-h-[30px] mt-2 flex items-center justify-center">
                <p id="feedback-msg" class="text-sm font-bold opacity-0 transition-opacity"></p>
            </div>
        </div>

        <button id="submit-btn" onclick="checkAnswer()" 
            class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
            Jawab (Enter)
        </button>
        
        <button onclick="skipQuestion()" 
            class="mt-3 w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold py-2 px-6 rounded-xl transition-colors">
            Lewati kata ini
        </button>
    </div>

    <script>
        // Data 14 kosa kata dari gambar papan tulis
        const vocabularies = [
            { en: "Water pollution", id: "pencemaran air" },
            { en: "Main cause", id: "penyebab utama" },
            { en: "Irresponsible", id: "tidak bertanggung jawab" },
            { en: "Human intervention", id: "campur tangan manusia" },
            { en: "Threaten", id: "mengancam" },
            { en: "Living Things", id: "mahluk hidup" }, // mengikuti teks di papan tulis "mahluk"
            { en: "Harmful substances", id: "zat berbahaya" },
            { en: "Using Detergent", id: "menggunakan deterjen" },
            { en: "Except", id: "kecuali" },
            { en: "Reduce", id: "mengurangi" },
            { en: "Planting Trees", id: "menanam pohon" },
            { en: "Waste Management", id: "pengelolaan limbah" },
            { en: "Filtered", id: "disaring" },
            { en: "Environmentally friendly material", id: "bahan ramah lingkungan" }
        ];

        let currentVocab = null;
        let score = 0;
        let isWaiting = false;

        const questionWordEl = document.getElementById('question-word');
        const targetLangEl = document.getElementById('target-lang');
        const answerInput = document.getElementById('answer-input');
        const scoreEl = document.getElementById('score');
        const feedbackMsg = document.getElementById('feedback-msg');

        function generateQuestion() {
            isWaiting = false;
            // Pilih kata acak
            const randomIndex = Math.floor(Math.random() * vocabularies.length);
            currentVocab = vocabularies[randomIndex];
            
            // Selalu tampilkan bahasa Inggris
            questionWordEl.textContent = currentVocab.en;

            answerInput.value = "";
            answerInput.disabled = false;
            answerInput.focus();
            hideFeedback();
        }

        function cleanString(str) {
            // Hapus spasi berlebih di awal/akhir dan ubah ke huruf kecil
            return str.trim().toLowerCase();
        }

        function checkAnswer() {
            if (isWaiting || !currentVocab || answerInput.value.trim() === "") return;

            const userAnswer = cleanString(answerInput.value);
            const correctAnswer = cleanString(currentVocab.id);

            isWaiting = true;
            answerInput.disabled = true;

            if (userAnswer === correctAnswer) {
                // Jawaban Benar
                score += 10;
                scoreEl.textContent = score;
                showFeedback("Benar! 🎉", "text-green-500");
                
                // Lanjut ke soal berikutnya dengan cepat
                setTimeout(generateQuestion, 1000);
            } else {
                // Jawaban Salah
                score = Math.max(0, score - 5); // Kurangi skor tapi tidak minus
                scoreEl.textContent = score;
                showFeedback(`Salah! Jawaban yang benar: "${currentVocab.id}"`, "text-red-500");
                
                // Beri waktu lebih lama untuk membaca jawaban yang benar
                setTimeout(generateQuestion, 2500);
            }
        }

        function skipQuestion() {
            if (isWaiting) return;
            showFeedback(`Dilewati. Jawaban: "${currentVocab.id}"`, "text-orange-500");
            isWaiting = true;
            setTimeout(generateQuestion, 1500);
        }

        function showFeedback(text, colorClass) {
            feedbackMsg.textContent = text;
            feedbackMsg.className = `text-sm font-bold transition-opacity opacity-100 ${colorClass}`;
        }

        function hideFeedback() {
            feedbackMsg.classList.remove('opacity-100');
            feedbackMsg.classList.add('opacity-0');
        }

        function resetGame() {
            score = 0;
            scoreEl.textContent = score;
            generateQuestion();
        }

        // Event listener untuk tombol Enter di keyboard
        answerInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Mulai game saat halaman dimuat
        window.onload = function() {
            generateQuestion();
        }
    </script>
</body>
</html>
